# Publish s2s-vulkan to GitHub Container Registry from monorepo root.
# Image: ghcr.io/<owner>/s2s-vulkan
#
# Actions use Node.js 24 runtimes (checkout v7, docker/* v4–v7).

name: GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "s2s-vulkan/**"
      - ".github/workflows/ghcr.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "s2s-vulkan/**"
      - ".github/workflows/ghcr.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Image set to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - controller

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: s2s-vulkan
  CONTEXT: s2s-vulkan
  BUNDLE_PATH: s2s-vulkan/deploy/speech-lab-bundle.json

jobs:
  publish-controller:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'controller'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test controller
        run: |
          cd s2s-vulkan/controller
          go test ./...

      - name: Image name (lowercase)
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/s2s-speech-lab-controller" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/docker/Dockerfile.controller
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AuraGo Speech Lab Controller
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "## Speech Lab controller"
            echo ""
            echo "Image: \`${{ steps.image.outputs.name }}:sha-${{ github.sha }}\`"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'controller'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free runner disk for managed images
        if: github.event_name != 'pull_request'
        run: |
          df -h /
          # The stock runner's Android, .NET and GHC SDKs are unused here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Validate bundle-v2 catalog matrix
        run: |
          python s2s-vulkan/scripts/speech_lab_bundle.py
          cd s2s-vulkan/controller
          go test ./...

      - name: Image name (lowercase)
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push managed sidecar images
        if: github.event_name != 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          reclaim_build_cache() {
            docker buildx prune --all --force
            df -h /
          }
          build() {
            repository="$1"; dockerfile="$2"; shift 2
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
              -t "ghcr.io/$owner/$repository:$TAG" -f "$dockerfile" "$@" s2s-vulkan
          }
          build_without_sbom() {
            repository="$1"; dockerfile="$2"; shift 2
            # The upstream Higgs image contains enough Python metadata to exceed
            # BuildKit's 40 MiB SBOM attestation limit. Keep provenance enabled.
            docker buildx build --platform linux/amd64 --provenance=true --sbom=false --push \
              -t "ghcr.io/$owner/$repository:$TAG" -f "$dockerfile" "$@" s2s-vulkan
          }
          if [[ "$GITHUB_REF_NAME" == "v0.2.16-speech-lab" ]]; then
            # Image progress changes the controller, gateway and browser UI.
            # Rebuild Qwen Vulkan with its native server; reuse other sidecars.
            build s2s-speech-lab-controller s2s-vulkan/docker/Dockerfile.controller
            build s2s-tts-qwen-vulkan s2s-vulkan/docker/Dockerfile.tts-vulkan
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
              -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web
            previous_tag=sha-a3703346c2d83414c4ffc0a2102150e40dec0cd8
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          changed = {"gateway", "controller", "web", "qwen_vulkan"}
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key not in changed}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.15-speech-lab" ]]; then
            # The managed catalog opt-in and browser warning change only the
            # gateway configuration and Web UI. Reuse signed sidecar images.
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
              -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web
            previous_tag=sha-69d982905c28ef2a2a614b4a088f6207cd25d62a
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          changed = {"gateway", "web"}
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key not in changed}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.14-speech-lab" ]]; then
            # The timeout fix changes the gateway, controller and browser UI.
            # Keep all model sidecars pinned to the signed v0.2.13 release.
            build s2s-speech-lab-controller s2s-vulkan/docker/Dockerfile.controller
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
              -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web
            previous_tag=sha-f0bf434c2fed302a55198f7083be27a8fecfba17
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          changed = {"gateway", "controller", "web"}
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key not in changed}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.13-speech-lab" ]]; then
            # The gateway, browser UI, and Whisper source changed since the
            # signed v0.2.10 bundle. Preserve every unchanged pinned sidecar.
            build s2s-whisper-fw s2s-vulkan/docker/Dockerfile.whisper
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
              -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web
            previous_tag=sha-38e0b5af867195fa9a5eba52a00eb54ed5ec5091
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          changed = {"gateway", "web", "whisper"}
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key not in changed}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.10-speech-lab" ]]; then
            # Refresh the gateway and browser UI; reuse the signed v0.2.7 sidecars.
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
              -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web
            previous_tag=sha-557ccf7e1209d47c859fa0ec7f2a5237b20d27ed
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key not in {"gateway", "web"}}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.8-speech-lab" || "$GITHUB_REF_NAME" == "v0.2.9-speech-lab" ]]; then
            # Only the gateway changes; reuse the signed v0.2.7 sidecars.
            previous_tag=sha-557ccf7e1209d47c859fa0ec7f2a5237b20d27ed
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key != "gateway"}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.7-speech-lab" ]]; then
            # Only the gateway changes; reuse the signed v0.2.6 sidecars.
            previous_tag=sha-f20fc389665f53c9615d9c57c117d66c2b4eb1e3
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key != "gateway"}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == "v0.2.6-speech-lab" ]]; then
            # This hotfix changes only the gateway catalog and the three Confucius
            # healthchecks. Re-tag the other images from the signed v0.2.4 bundle.
            previous_tag=sha-7e488b961c1e05b49cb36d06bf51159cccbb05a1
            build s2s-asr-confucius-cpu s2s-vulkan/docker/Dockerfile.confucius
            build s2s-asr-confucius-cuda s2s-vulkan/docker/Dockerfile.confucius \
              --build-arg LLAMA_BASE_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:bfb3264fc2166e01e2b4f9b537e45d7006d87c75021b911f132ef607f5bbced3
            build s2s-asr-confucius-vulkan s2s-vulkan/docker/Dockerfile.confucius \
              --build-arg LLAMA_BASE_IMAGE=ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:e3ec7c0cd473df7dfff299a60a0f292bf5c3e6a5202286484f896819eca6d6ed
            mapfile -t unchanged_repositories < <(python - <<'PY'
          import json
          with open("s2s-vulkan/deploy/speech-lab-bundle.json", encoding="utf-8") as fh:
              images = json.load(fh)["images"]
          changed = {"gateway", "confucius_cpu", "confucius_cuda", "confucius_vulkan"}
          for repository in sorted({ref.split("/", 2)[-1].split("@", 1)[0]
                                    for key, ref in images.items() if key not in changed}):
              print(repository)
          PY
            )
            for repository in "${unchanged_repositories[@]}"; do
              docker buildx imagetools create \
                -t "ghcr.io/$owner/$repository:$TAG" \
                "ghcr.io/$owner/$repository:$previous_tag"
            done
            exit 0
          fi
          build s2s-speech-lab-controller s2s-vulkan/docker/Dockerfile.controller
          build s2s-whisper-fw s2s-vulkan/docker/Dockerfile.whisper
          build s2s-asr-confucius-cpu s2s-vulkan/docker/Dockerfile.confucius
          build s2s-asr-confucius-cuda s2s-vulkan/docker/Dockerfile.confucius \
            --build-arg LLAMA_BASE_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:bfb3264fc2166e01e2b4f9b537e45d7006d87c75021b911f132ef607f5bbced3
          build s2s-asr-confucius-vulkan s2s-vulkan/docker/Dockerfile.confucius \
            --build-arg LLAMA_BASE_IMAGE=ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:e3ec7c0cd473df7dfff299a60a0f292bf5c3e6a5202286484f896819eca6d6ed
          build s2s-asr-parakeet-cpu s2s-vulkan/docker/Dockerfile.parakeet
          build s2s-asr-parakeet-cuda s2s-vulkan/docker/Dockerfile.parakeet \
            --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128
          build s2s-asr-voxtral-cpu s2s-vulkan/docker/Dockerfile.voxtral
          build s2s-asr-voxtral-cuda s2s-vulkan/docker/Dockerfile.voxtral \
            --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128
          reclaim_build_cache
          build s2s-tts-qwen-sycl-aot s2s-vulkan/docker/Dockerfile.tts-sycl \
            --build-arg SYCL_DEVICE_ARCH=bmg_g21
          build s2s-tts-qwen-sycl-jit s2s-vulkan/docker/Dockerfile.tts-sycl
          reclaim_build_cache
          build s2s-tts-qwen-vulkan s2s-vulkan/docker/Dockerfile.tts
          build s2s-tts-qwen-cuda s2s-vulkan/docker/Dockerfile.tts
          build s2s-tts-kokoro s2s-vulkan/docker/Dockerfile.kokoro
          build s2s-tts-vibevoice-cpu s2s-vulkan/docker/Dockerfile.vibevoice
          build s2s-tts-vibevoice-cuda s2s-vulkan/docker/Dockerfile.vibevoice \
            --build-arg CRISPASR_IMAGE=ghcr.io/crispstrobe/crispasr:main-cuda
          reclaim_build_cache
          build_without_sbom s2s-tts-higgs-cuda s2s-vulkan/docker/Dockerfile.higgs
          build s2s-llama-granite s2s-vulkan/docker/Dockerfile.llama
          build s2s-llama-granite-cuda s2s-vulkan/docker/Dockerfile.llama \
            --build-arg LLAMA_BASE_IMAGE=ghcr.io/ggml-org/llama.cpp:server-cuda
          build s2s-model-init s2s-vulkan/docker/Dockerfile.backend-init
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push \
            -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web

      - name: Publish bundle manifest
        if: github.event_name != 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          TAG: sha-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.SPEECH_LAB_MANIFEST_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          digest() { docker buildx imagetools inspect "ghcr.io/$owner/$1:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          gateway_tag="${GITHUB_REF_NAME#v}"
          gateway=$(docker buildx imagetools inspect "ghcr.io/$owner/s2s-vulkan:${gateway_tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          export GATEWAY_DIGEST="$gateway"
          python - <<'PY'
          import json, os, sys
          with open(os.environ["BUNDLE_PATH"], encoding="utf-8") as fh:
              bundle = json.load(fh)
          owner = os.environ["OWNER"].lower()
          version = os.environ.get("GITHUB_REF_NAME") or ("sha-" + os.environ["SHA"][:12])
          repositories = {key: value.split("/", 2)[-1].split("@", 1)[0] for key, value in bundle["images"].items()}
          digests = {"gateway": os.environ["GATEWAY_DIGEST"]}
          import subprocess
          for key, repository in repositories.items():
              if repository == repositories["gateway"]:
                  digests[key] = os.environ["GATEWAY_DIGEST"]
                  continue
              ref = f"ghcr.io/{owner}/{repository}:{os.environ['TAG']}"
              digests[key] = subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect", ref, "--format", "{{json .Manifest.Digest}}"],
                  text=True,
              ).strip().strip('"')
          images = {key: f"ghcr.io/{owner}/{repositories[key]}@{digest}" for key, digest in digests.items()}
          bundle["publisher"] = f"ghcr.io/{owner}"
          bundle["bundle_version"] = version
          bundle["images"] = images
          for runtime in bundle["runtimes"]:
              runtime["image"] = images[runtime["image_key"]]
          with open("speech-lab-bundle.json", "w", encoding="utf-8") as fh:
              json.dump(bundle, fh, indent=2)
              fh.write("\n")
          PY
          sha256sum speech-lab-bundle.json > speech-lab-bundle.json.sha256
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test -n "$MANIFEST_SIGNING_KEY_B64" || { echo "SPEECH_LAB_MANIFEST_ED25519_PRIVATE_KEY_B64 is required for release tags" >&2; exit 1; }
            umask 077
            printf '%s' "$MANIFEST_SIGNING_KEY_B64" | base64 --decode > speech-lab-manifest-signing-key.pem
            trap 'rm -f speech-lab-manifest-signing-key.pem' EXIT
            key_description=$(openssl pkey -in speech-lab-manifest-signing-key.pem -text_pub -noout 2>&1)
            [[ "$key_description" == *"ED25519"* ]] || { echo "Speech Lab manifest signing key is not Ed25519" >&2; exit 1; }
            openssl pkeyutl -sign -rawin -inkey speech-lab-manifest-signing-key.pem \
              -in speech-lab-bundle.json -out speech-lab-bundle.json.sig
            rm -f speech-lab-manifest-signing-key.pem
            [[ "$(wc -c < speech-lab-bundle.json.sig)" -eq 64 ]] || { echo "Speech Lab manifest signature has an invalid size" >&2; exit 1; }
            gh release create "${GITHUB_REF_NAME}" --generate-notes || true
            gh release upload "${GITHUB_REF_NAME}" speech-lab-bundle.json speech-lab-bundle.json.sha256 speech-lab-bundle.json.sig --clobber
          fi

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## GHCR"
            echo ""
            echo "\`docker pull ${{ steps.image.outputs.name }}:latest\`"
            echo ""
            echo "Tags:"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
