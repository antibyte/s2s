# Publish s2s-vulkan to GitHub Container Registry from monorepo root.
# Image: ghcr.io/<owner>/s2s-vulkan
#
# Actions use Node.js 24 runtimes (checkout v7, docker/* v4–v7).

name: GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "s2s-vulkan/**"
      - ".github/workflows/ghcr.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "s2s-vulkan/**"
      - ".github/workflows/ghcr.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: s2s-vulkan
  CONTEXT: s2s-vulkan
  BUNDLE_PATH: s2s-vulkan/deploy/speech-lab-bundle.json

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image name (lowercase)
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0-dev' }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push managed sidecar images
        if: github.event_name != 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push -t "ghcr.io/$owner/s2s-whisper-fw:$TAG" -f s2s-vulkan/docker/Dockerfile.whisper s2s-vulkan
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push -t "ghcr.io/$owner/s2s-llama-granite:$TAG" -f s2s-vulkan/docker/Dockerfile.llama s2s-vulkan
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push -t "ghcr.io/$owner/s2s-model-init:$TAG" -f s2s-vulkan/docker/Dockerfile.backend-init s2s-vulkan
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true --push -t "ghcr.io/$owner/s2s-web:$TAG" -f s2s-vulkan/web/Dockerfile s2s-vulkan/web

      - name: Publish bundle manifest
        if: github.event_name != 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          TAG: sha-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          digest() { docker buildx imagetools inspect "ghcr.io/$owner/$1:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          gateway_tag="${GITHUB_REF_NAME#v}"
          gateway=$(docker buildx imagetools inspect "ghcr.io/$owner/s2s-vulkan:${gateway_tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          asr=$(digest s2s-whisper-fw)
          llm=$(digest s2s-llama-granite)
          web=$(digest s2s-web)
          init=$(digest s2s-model-init)
          python - "$gateway" "$asr" "$llm" "$web" "$init" <<'PY'
          import json, os, sys
          with open(os.environ["BUNDLE_PATH"], encoding="utf-8") as fh:
              bundle = json.load(fh)
          owner = os.environ["OWNER"].lower()
          version = os.environ.get("GITHUB_REF_NAME") or ("sha-" + os.environ["SHA"][:12])
          names = ["s2s-vulkan", "s2s-whisper-fw", "s2s-llama-granite", "s2s-web", "s2s-model-init"]
          digests = dict(zip(names, sys.argv[1:]))
          image = lambda name: f"ghcr.io/{owner}/{name}@{digests[name]}"
          bundle["publisher"] = f"ghcr.io/{owner}"
          bundle["bundle_version"] = version
          bundle["images"] = {
              "gateway": image("s2s-vulkan"), "asr": image("s2s-whisper-fw"),
              "tts": image("s2s-vulkan"), "llm": image("s2s-llama-granite"),
              "web": image("s2s-web"), "model_init": image("s2s-model-init")
          }
          with open("speech-lab-bundle.json", "w", encoding="utf-8") as fh:
              json.dump(bundle, fh, indent=2)
              fh.write("\n")
          PY
          sha256sum speech-lab-bundle.json > speech-lab-bundle.json.sha256
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes || true
            gh release upload "${GITHUB_REF_NAME}" speech-lab-bundle.json speech-lab-bundle.json.sha256 --clobber
          fi

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## GHCR"
            echo ""
            echo "\`docker pull ${{ steps.image.outputs.name }}:latest\`"
            echo ""
            echo "Tags:"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
