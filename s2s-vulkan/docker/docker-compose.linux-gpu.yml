# Linux host with /dev/dri (Intel/AMD) or use nvidia override separately.
#
#   docker compose -f docker-compose.yml -f docker/docker-compose.linux-gpu.yml \
#     --profile backends --profile web up -d

x-dri-devices: &dri-devices
  - /dev/dri:/dev/dri

services:
  granite-speech-vulkan:
    build:
      context: .
      dockerfile: docker/Dockerfile.granite-speech
      args:
        LLAMA_BASE_IMAGE: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:a644fb651975d9dea49140302577a3b945993fd5efd3400bf89c7d525d03c103
    image: ${GRANITE_SPEECH_VULKAN_IMAGE:-s2s-asr-granite-speech:vulkan}
    container_name: s2s-granite-speech-vulkan
    profiles: ["managed"]
    labels:
      s2s.lab.managed: "true"
      stage: asr
      backend-id: granite-speech-5.0-2b
    command: ["-m", "/models/granite-speech-5.0-2b/granite-speech-5.0-2b.i1-Q4_K_M.gguf", "--mmproj", "/models/granite-speech-5.0-2b/granite-speech-5.0-2b.mmproj-Q8_0.gguf", "--alias", "granite-speech-5.0-2b", "--host", "0.0.0.0", "--port", "8082", "-c", "4096", "-ngl", "99", "--threads", "2"]
    devices: *dri-devices
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      - models:/models:ro
    networks:
      - s2s
    restart: unless-stopped

  s2s:
    devices: *dri-devices
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  whisper:
    devices: *dri-devices
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"

  confucius:
    build:
      context: ..
      dockerfile: docker/Dockerfile.confucius
      args:
        LLAMA_BASE_IMAGE: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:e3ec7c0cd473df7dfff299a60a0f292bf5c3e6a5202286484f896819eca6d6ed
    image: ${CONFUCIUS_IMAGE:-s2s-asr-confucius:vulkan}
    container_name: s2s-confucius-vulkan
    networks:
      s2s:
        aliases:
          - confucius-asr
          - confucius-vulkan
    devices: *dri-devices
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    command:
      - -m
      - /opt/s2s-models/confucius4-r2t2.Q4_K_M.gguf
      - --mmproj
      - /opt/s2s-models/confucius4-r2t2.mmproj-Q8_0.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8082"
      - -c
      - "4096"
      - -ngl
      - "99"
      - --alias
      - confucius4-r2t2

  llama:
    devices: *dri-devices
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    environment:
      # Offload all layers when a real GPU is visible in the container
      LLAMA_NGL: ${LLAMA_NGL:-99}
    command:
      - -m
      - /opt/s2s-models/granite-3.3-2b-instruct-q4_k_m.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8081"
      - -ngl
      - "${LLAMA_NGL:-99}"
      - -c
      - "${LLAMA_CTX:-2048}"
      - --alias
      - ${S2S_LLM_MODEL:-granite-3.3-2b-instruct}

  tts:
    devices: *dri-devices
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
