server {
    listen 80;
    server_name localhost 127.0.0.1 s2s-web;
    # Reject DNS rebinding to the loopback web port. AuraGo's authenticated
    # proxy presents the internal s2s-web host after validating the browser.
    if ($host !~* ^(localhost|127\.0\.0\.1|s2s-web)$) {
        return 421;
    }
    root /usr/share/nginx/html;
    index index.html;

    # SPA-ish static
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|svg|png|ico)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Optional reverse-proxy to s2s WebSocket (same origin → ws(s)://host/ws)
    # Enable by setting S2S_UPSTREAM=s2s:8765 in compose.
    location /ws {
        proxy_pass http://s2s_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/realtime {
        proxy_pass http://s2s_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://s2s_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
